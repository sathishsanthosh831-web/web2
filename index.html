<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Website A - Create Link</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #312e81 50%, #0f172a);
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    animation: fadeUp 0.5s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #a5b4fc, #f0abfc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub { color: #94a3b8; font-size: 0.92rem; margin-bottom: 24px; }

  label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }

  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(15, 23, 42, 0.6);
    color: #f1f5f9;
    font-size: 0.97rem;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: #818cf8;
    box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
  }

  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(90deg, #6366f1, #a855f7);
    transition: transform 0.15s, opacity 0.2s;
    text-decoration: none;
    display: block;
    text-align: center;
  }

  .btn:hover { transform: translateY(-2px); opacity: 0.92; }

  .btn.secondary {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    margin-top: 10px;
  }

  .error {
    color: #fca5a5;
    font-size: 0.88rem;
    margin: -6px 0 14px;
    min-height: 1.2em;
  }

  .result {
    display: none;
    margin-top: 22px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.35);
    word-break: break-all;
    font-size: 0.85rem;
    color: #bbf7d0;
  }

  .result.show { display: block; }
</style>
</head>
<body>

<div class="card">
  <h1>Create Link</h1>
  <p class="sub">Name-um link-um kudunga, Website B link ready aagum.</p>

  <label for="nameInput">Name</label>
  <input id="nameInput" type="text" placeholder="Eg: Sathish" maxlength="40" />

  <label for="linkInput">Link</label>
  <input id="linkInput" type="url" placeholder="https://example.com" />

  <div class="error" id="errorMsg"></div>

  <button class="btn" id="confirmBtn">Confirm</button>

  <div class="result" id="resultBox">
    <div>Ready! Indha link-ah share pannunga:</div>
    <div id="shareUrl" style="margin-top:8px;"></div>
    <button class="btn secondary" id="copyBtn">Copy link</button>
    <a class="btn secondary" id="openBtn" target="_blank" rel="noopener noreferrer">Open Website B</a>
  </div>
</div>

<script>
  // ⚠️ Website B-oda GitHub Pages link-ah inga maathunga
  const WEBSITE_B_URL = "https://sathishsanthosh831-web.github.io/web1/";

  const $ = (id) => document.getElementById(id);

  // Returns a safe http/https URL or null
  function cleanUrl(value) {
    try {
      const u = new URL(value.trim());
      return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
    } catch {
      return null;
    }
  }

  $("confirmBtn").addEventListener("click", () => {
    const name = $("nameInput").value.trim();
    const link = $("linkInput").value.trim();
    const error = $("errorMsg");
    error.textContent = "";
    $("resultBox").classList.remove("show");

    if (!name) {
      error.textContent = "Name type pannunga.";
      return;
    }
    const safeLink = cleanUrl(link);
    if (!safeLink) {
      error.textContent = "Sariyana link paste pannunga (https:// la start aaganum).";
      return;
    }

    const url = WEBSITE_B_URL + "?name=" + encodeURIComponent(name) +
                "&link=" + encodeURIComponent(safeLink);

    $("shareUrl").textContent = url;
    $("openBtn").href = url;
    $("resultBox").classList.add("show");
  });

  $("copyBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("shareUrl").textContent);
      $("copyBtn").textContent = "Copied! ✓";
    } catch {
      $("copyBtn").textContent = "Copy failed";
    }
    setTimeout(() => ($("copyBtn").textContent = "Copy link"), 1500);
  });
</script>

</body>
</html>
